name: Generate Snake

on:
  # רץ אוטומטית כל 24 שעות
  schedule:
    - cron: "0 0 * * *" 
  
  # מאפשר להריץ את זה ידנית מתי שרוצים בלשונית Actions
  workflow_dispatch:
  
  # רץ אוטומטית בכל פעם שאתה דוחף קוד לענף הראשי
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # מייצר את אנימציית הנחש לפי שם המשתמש שלך
      - name: generate-github-contribution-grid-snake
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # דוחף את תמונות ה-SVG שנוצרו לתוך ענף מיוחד שנקרא output
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
